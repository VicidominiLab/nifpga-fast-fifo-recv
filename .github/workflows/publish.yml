name: Build Windows wheels and publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows CPython ${{ matrix.python }} without NI runtime
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Verify the build machine has no NI runtime
        shell: pwsh
        run: |
          foreach ($directory in @('System32', 'SysWOW64')) {
            if (Test-Path (Join-Path $env:WINDIR "$directory\NiFpga.dll")) {
              throw 'This job must demonstrate a build without NI runtime libraries.'
            }
          }
      - name: Install build and artifact inspection tools
        run: python -m pip install "maturin>=1.1,<2" "twine>=6,<7" pefile "tomli>=2,<3"
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import tomli
          version = tomli.loads(Path('Cargo.toml').read_text())['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          '@ | python -
      - name: Build wheel without NI SDK or DLL
        shell: pwsh
        run: |
          $env:PYO3_PYTHON = (Get-Command python).Source
          # Historical source snapshots do not track Cargo.lock.
          if (-not (Test-Path Cargo.lock)) {
            cargo generate-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m maturin build --release --locked --target x86_64-pc-windows-msvc --interpreter $env:PYO3_PYTHON --out dist
      - name: Build source distribution
        if: matrix.python == '3.13'
        run: python -m maturin sdist --out dist
      - name: Verify wheel contains no NI libraries and imports NiFpga.dll
        run: python scripts/verify_wheels.py dist --python-version ${{ matrix.python }}
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      # Importing the extension and executing runtime tests require NI's DLL.
      # This runner checks the PE imports without loading the extension.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-cp${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nifpga-fast-fifo-recv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
